# Fourth reviewed batch: non-supplier funding of the private labs.
#
# WHY THIS MATTERS. The CENTRAL provenance bound divides a supplier's funding of
# a lab by that lab's DOCUMENTED external funding. If the only funding edges in
# the ledger are the ones suppliers disclose, that denominator contains nothing
# but suppliers, and every supplier's share is overstated by construction. The
# SoftBank to OpenAI edge already guards against this on the OpenAI side. These
# rows do the same on the Anthropic side.
#
# The counterparty is recorded as a single aggregate node because the releases
# name dozens of funds without per-fund amounts. Attributing a figure to any one
# of them would be invention. The aggregate carries the round total net of the
# supplier money the release itself identifies, as a range where the release is
# imprecise.
edges:
