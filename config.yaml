# Round-Trip AI configuration. All parameters that move the answer live here.
# Pre-registered defaults; see DECISIONS.md Part A.

project:
  title: "Round-Trip AI: Who Is Financing Their Own Customers?"
  as_of: "2026-10-05"

sec:
  user_agent_env: SEC_USER_AGENT
  max_requests_per_second: 5
  cache_dir: data/raw
  retries: 5
  backoff_base_seconds: 1.0
  timeout_seconds: 30
  since: "2023-01-01"

# Status weights. Columns feed the LOWER / CENTRAL / UPPER bounds respectively.
status_weights:
  definitive:     {low: 1.00, central: 1.00, high: 1.00}
  conditional:    {low: 0.25, central: 0.50, high: 0.80}
  LOI_nonbinding: {low: 0.05, central: 0.25, high: 0.60}
  announced:      {low: 0.30, central: 0.60, high: 0.90}
  reported:       {low: 0.00, central: 0.25, high: 0.60}

tiers:
  headline_allowed: [T1, T2]
  sensitivity_allowed: [T1, T2, T3]
  never: [T4]

amounts:
  basis_tcv: [notional, cumulative, RPO]
  assumed_term_years: 5
  assumed_term_years_sensitivity: [3, 8]

multihop:
  alpha: 0.85
  max_hops: 6

structure:
  max_cycle_len: 6

stress:
  passthrough: 0.60
  passthrough_range: [0.30, 0.90]
  capacity_to_invest: 0.50
  capacity_to_invest_range: [0.20, 0.80]
  loi_conversion: 0.25
  loi_conversion_range: [0.05, 0.60]
  conditional_realisation: 0.50
  conditional_realisation_range: [0.25, 0.80]
  fixed_point_tol: 1.0e-9
  max_iter: 200
  monte_carlo_draws: 20000
  random_seed: 20261005

news:
  gdelt_enabled: true
  gdelt_max_records: 75
  lookback_days: 45
  max_items_per_feed: 60   # some newsrooms publish their whole history in one feed
  embed_model: "sentence-transformers/all-MiniLM-L6-v2"
  similarity_threshold: 0.42
  dedupe_threshold: 0.90

# Optional agentic extractor. Existing make refresh stays rules-only.
# All model execution is on loopback Ollama; no keys or paid services.
deal_agent:
  prompt_version: v1
  model: qwen2.5:7b-instruct
  ollama_url: http://127.0.0.1:11434
  llm_timeout_seconds: 300
  num_ctx: 8192
  chunk_chars: 10000
  chunk_overlap: 1200
  min_entities: 2
  confidence_warning_threshold: 0.70
  update_match_days: 365
  initial_since: "2025-01-01"
  overlap_days: 2
  polite_delay_seconds: 0.25
  max_documents_per_run: 100
  news_corpus: data/interim/news_items.csv
  state_db: data/deal_agent/queue.sqlite3
  raw_dir: data/deal_agent/raw
  trace_dir: data/deal_agent/traces
  graph_file: ledger/edges.csv
  nodes_file: ledger/nodes.csv
  legacy_queues: [ledger/candidates.csv, ledger/news_candidates.csv]
  watchlist: [Nvidia, AMD, Oracle, CoreWeave, Microsoft, Amazon, Alphabet, Meta, Broadcom, Nebius]
  feeds: []
  # Public publisher RSS examples; uncomment and confirm URLs before running:
  # feeds:
  #   - {company: OpenAI, url: "https://openai.com/news/rss.xml"}
  #   - {company: Nvidia, url: "https://nvidianews.nvidia.com/releases.xml"}
  #   - {company: Microsoft, url: "https://blogs.microsoft.com/feed/"}
  keywords: [invest, invests, invested, investing, investment, funding, equity,
    commitment, committed, purchase, agreement, contract, partnership, loan,
    debt, financing, warrant, warrants, options, revenue, capacity, billion,
    million, gigawatt, gigawatts, expanded, expands, amended]
  # Keys match the existing node names EXACTLY. Values are alternative mentions.
  # Google resolves to Alphabet; no duplicate Google node is introduced.
  aliases:
    Nvidia: [NVIDIA, NVIDIA Corporation, Nvidia Corporation, NVDA]
    AMD: [Advanced Micro Devices, "Advanced Micro Devices, Inc."]
    Broadcom: [Broadcom Inc, "Broadcom Inc.", AVGO]
    Oracle: [Oracle Corporation, ORCL]
    CoreWeave: ["CoreWeave, Inc.", CRWV]
    Microsoft: [Microsoft Corporation, Microsoft Corp., MSFT, Azure]
    Amazon: [Amazon.com, Amazon.com Inc., Amazon Web Services, AWS, AMZN]
    Alphabet: [Alphabet Inc., Google, Google LLC, Google Cloud, Google DeepMind, GOOGL, GOOG]
    Meta: [Meta Platforms, "Meta Platforms, Inc.", META]
    OpenAI: [OpenAI OpCo, "OpenAI OpCo, LLC", OpenAI Global, "OpenAI, L.L.C."]
    Anthropic: [Anthropic PBC, "Anthropic, PBC"]
    Nebius: [Nebius Group, NBIS]
    Nscale: [Nscale Limited, Nscale Global]
    SoftBank: [SoftBank Group, SoftBank Vision Fund]
    xAI: [xAI Corp, xAI Holdings, X.AI]
